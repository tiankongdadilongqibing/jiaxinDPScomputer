## Battle-clock source. game = THE GAME'S OWN CLOCK (default): GameSystem.GameTime update steps divided by the game's units-per-second, so the meter ticks exactly like skill cooldowns do. real = real seconds from an internal stopwatch. engine = Time.deltaTime. MEASURED on 2026-09-27 (timeScale 1.5): GameTime, the on-screen counter GameTimeLimitCounter.NowTime and a skill's wait counter all advance 45.0 units per real second, and Skill.CoolTimeFrame / Skill.CoolTime = 30.0 for every skill (750/25, 1500/50, 1050/35) => 1 game second = 30 units and the game clock runs 45/30 = 1.5x real time. The cooldown itself is unit based: Skill.m_coolTimeFrame / m_waitCountFrame, decremented once per game update.
# Setting type: String
# Default value: game
ClockSource = game

## FEATURE (R71, completed in R72): move the battle clock's ORIGIN from 'the plugin saw the battle' to 'the game started it', once per battle, before the first event is stamped. WHY: the RATE was always right (ClockSource=game), but the origin was ~0.9 s late, so every published time (page stamps, active= columns, export events[].t / duration, per-second buckets) was early against the game's own numbers. MEASURED 2026-10-06 by three independent routes: (1) auto-skill charge counters -- lag = (FirstCoolTime - WaitCountFrame)/units - active = 0.90-0.93 s, constant over 12 slots x 3 battles (the counter is INITIALISED to FirstCoolTime and reset to CoolTime, which is why the master has both numbers); (2) the game's own on-screen timer -- now/30 + active was constant to 0.03-0.07 s over 27-40 samples at 89.10 (90 s stage) and 119.10 (120 s stage) => same rate, lag 0.90 s; (3) the page's earliest activation per skill vs the master's FirstCoolTime -- every skill fired at firstCool - 0.9 s. R72 fixed WHY IT NEVER LANDED: R71 only attempted the alignment from the session's SECOND frame on, and the game stamps its opening damage in the frame that creates the session, so both battles the user played ended in '[CLOCK] origin=none reason=events' (hits=5 at 0.121 s; hits=1 at 0.029 s) with no shift. Now the decision is attempted when the session is created, and any damage/heal that still arrives before the evidence is HELD and replayed at its arrival instant plus the decided lag (page rows, pending damage figures, the probes' stamps and the attack snapshot are moved by the same constant). The shift is applied only when at least 2 auto-skill slots answer and inside the first 2 s; otherwise the [CLOCK] line says why (off/few/window/events/range/hold) and the times keep the old origin. Old files (< 1.7.22) keep the old origin, i.e. their absolute times are ~0.9 s early; relative quantities are unaffected. Set false to keep the old behaviour.
# Setting type: Boolean
# Default value: true
ClockAlignToBattleStart = true

