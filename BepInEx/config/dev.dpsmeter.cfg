## FEATURE (1.5.3): fold 狂気 (Madness) on the VICTIM as an INCOMING damage multiplier. The 1.4.1 fold only covers the OUTGOING side (the holder DEALS more); 狂気 also raises the damage its holder TAKES (被ダメージ+50%), and the composition never modelled that side, so every hit whose victim carried 狂気 was short by exactly that factor. MEASURED 2026-10-03 on battle_411001_20261003_183213 vs _191159: two clean テトラ cells with a baseline residual of 1.0 go 0.9996 -> 1.4954 and 0.9965 -> 1.5011 (x1.4961 / x1.5063), and the pooled controlled factor is 1.4886 (58.7M damage without 狂気 vs 45.2M with). The factor is the measured 1.5 and NOT ratio/100: MadnessAllyBuffRatio is the ALLY buff (it reads 250 on an enemy, which is not this factor), so a victim-side ratio would over-count. The flag is exported per hit as victimMadnessOn either way, so the rule stays falsifiable from data. Set false to measure without folding: the reading stays in the export and the factor stays in the residual.
# Setting type: Boolean
# Default value: true
MadnessVictim = true

## FEATURE (1.4.1): fold 狂気 (Madness) as an OUTGOING damage multiplier, read from the ATTACKER's `Character.Status.MadnessAllyBuffRatio` (`CharaStatus`). MEASURED 2026-10-03 on battle_411001_20261003_150140: 924/924 of メアリー's damage records satisfy `residual == 1.15^n x (狂気 ? 2.5 : 1.0)` with ZERO exceptions, where 狂気 is read independently from the per-hit `comp4.自身状态` (834 with 狂気 all reduce to exactly 2.5; the 90 without reduce to 1.0), and `MadnessAllyBuffRatio` reads 250 while 狂気 is on versus 100 otherwise -- so 100 is neutral and the factor is ratio/100. Before this the plugin read 狂気 ONLY as one of the 18 RESISTANCE slots, never as a damage modifier. Both conditions are required (IsMadness AND ratio>100) so a unit holding the status with a neutral ratio cannot be over-counted, and a failed read falls back to x1.0. The raw ratio and the flag are exported per hit (`madnessRatio`/`madnessOn`) either way, so the rule stays falsifiable from data. Set false to measure without folding: the reading stays in the export and the factor stays in the residual.
